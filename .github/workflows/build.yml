name: Build Windows

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: pawetta-agent-windows
          path: dist/Pawetta-Agent-*.exe
          if-no-files-found: error
